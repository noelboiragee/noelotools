<!-- বাংলা: ব্যবহারকারীর পছন্দ ছাড়া ঐচ্ছিক কুকি চালু হবে না। -->
<section class="cookie-banner" data-cookie-banner role="dialog" aria-labelledby="cookie-title" aria-describedby="cookie-description" hidden>
  <h2 id="cookie-title">Your privacy matters</h2>
  <p id="cookie-description">We use necessary storage to make this site work. Optional analytics and advertising are only enabled with your permission.</p>
  <div class="cookie-actions">
    <button class="button button-primary" type="button" data-cookie-accept>Accept all</button>
    <button class="button button-secondary" type="button" data-cookie-reject>Reject optional</button>
    <button class="button button-ghost" type="button" data-cookie-customise>Customise</button>
  </div>
  <div class="cookie-settings" data-cookie-settings hidden>
    <label><input type="checkbox" checked disabled> Necessary (always active)</label><br>
    <label><input type="checkbox" name="cookie-analytics"> Analytics</label><br>
    <label><input type="checkbox" name="cookie-advertising"> Advertising</label><br>
    <button class="button button-primary" type="button" data-cookie-save style="margin-top:.75rem">Save preferences</button>
  </div>
</section>
